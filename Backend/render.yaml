services:
  # TGManager NestJS Backend API Service
  - type: web
    name: tgmanager-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tgmanager-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tg-manager.vercel.app"
      - key: SEED_DEMO
        value: "true"
      - key: DB_SEED_ON_START
        value: "true"
      # Web Push (chat offline + push). Add the VAPID keys in the Render
      # dashboard (Settings > Environment) rather than committing the private
      # key here. Example values:
      #   PUSH_ENABLED=true
      #   VAPID_PUBLIC_KEY=BOR0F9mc45i9uNFQgV0EpRGhOJzh9L-ZsvaVGXhaIdCvQnbaPkQsE0LyEFMF8uXUtV-zk3uwkpi--oC4GDBRDFA
      #   VAPID_PRIVATE_KEY=<generated with: npx web-push generate-vapid-keys>
      #   VAPID_SUBJECT=mailto:no-reply@tgmanager.example

databases:
  # Managed PostgreSQL Database
  - name: tgmanager-db
    databaseName: tgmanager
    user: tgmanager
    plan: free
    region: oregon
