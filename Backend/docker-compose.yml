services:
  postgres:
    image: postgres:16-alpine
    container_name: tgmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tgmanager
      POSTGRES_PASSWORD: tgmanager
      POSTGRES_DB: tgmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgmanager -d tgmanager"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
